<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Kanban workspace illustration">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="chip2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <circle cx="272" cy="34" r="20" fill="#ffffff" opacity=".18"/>
  <circle cx="28" cy="208" r="26" fill="#ffffff" opacity=".12"/>
  <!-- board -->
  <rect x="18" y="22" width="284" height="196" rx="18" fill="#ffffff" opacity=".16"/>
  <rect x="30" y="36" width="260" height="14" rx="7" fill="#ffffff" opacity=".45"/>
  <!-- column 1 -->
  <g>
    <rect x="34" y="62" width="80" height="142" rx="12" fill="url(#card)"/>
    <rect x="44" y="72" width="38" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="44" y="88" width="60" height="44" rx="8" fill="#ffffff"/>
    <rect x="50" y="96" width="30" height="7" rx="3.5" fill="url(#chip1)"/>
    <rect x="50" y="109" width="44" height="6" rx="3" fill="#e2e8f0"/>
    <circle cx="56" cy="124" r="6" fill="#7c3aed"/><circle cx="68" cy="124" r="6" fill="#38bdf8"/>
    <rect x="44" y="140" width="60" height="36" rx="8" fill="#ffffff"/>
    <rect x="50" y="148" width="24" height="7" rx="3.5" fill="url(#chip2)"/>
    <rect x="50" y="161" width="38" height="6" rx="3" fill="#e2e8f0"/>
  </g>
  <!-- column 2 -->
  <g>
    <rect x="124" y="62" width="80" height="142" rx="12" fill="url(#card)"/>
    <rect x="134" y="72" width="46" height="8" rx="4" fill="#a78bfa"/>
    <rect x="134" y="88" width="60" height="52" rx="8" fill="#ffffff"/>
    <rect x="140" y="94" width="48" height="18" rx="5" fill="#ddd6fe"/>
    <rect x="140" y="118" width="42" height="6" rx="3" fill="#e2e8f0"/>
    <circle cx="146" cy="132" r="6" fill="#f59e0b"/><circle cx="158" cy="132" r="6" fill="#7c3aed"/>
    <rect x="134" y="148" width="60" height="30" rx="8" fill="#ffffff"/>
    <rect x="140" y="156" width="36" height="6" rx="3" fill="#e2e8f0"/>
  </g>
  <!-- column 3 -->
  <g>
    <rect x="214" y="62" width="80" height="142" rx="12" fill="url(#card)"/>
    <rect x="224" y="72" width="30" height="8" rx="4" fill="#86efac"/>
    <rect x="224" y="88" width="60" height="40" rx="8" fill="#ffffff"/>
    <path d="M232 108 l7 7 l13 -14" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="252" y="100" width="24" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="252" y="112" width="18" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="224" y="136" width="60" height="12" rx="6" fill="#dcfce7"/>
    <rect x="224" y="136" width="44" height="12" rx="6" fill="#22c55e"/>
  </g>
  <!-- floating cursor card -->
  <g transform="rotate(-6 262 196)">
    <rect x="216" y="182" width="86" height="30" rx="9" fill="#2e1065"/>
    <circle cx="232" cy="197" r="7" fill="#f59e0b"/>
    <rect x="244" y="193" width="44" height="8" rx="4" fill="#ffffff" opacity=".85"/>
